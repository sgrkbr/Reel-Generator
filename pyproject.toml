[project]
name = "reel-generator"
version = "0.1.0"
description = "Animated couple-skit short-video pipeline (Higgsfield + R2 + Postiz)"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "click>=8.1",
    "imageio-ffmpeg>=0.5",
    "openai>=1.30",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "python-frontmatter>=1.1",
    "pyyaml>=6.0",
    "requests>=2.32",
]

[project.scripts]
reel = "scripts.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["pipelines*", "scripts*"]
