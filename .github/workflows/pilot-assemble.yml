name: pilot-assemble

on:
  push:
    branches: [claude/zen-hopper-214mam]
    paths: ['scripts/pilot2/**', '.github/workflows/pilot-assemble.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - name: Install python deps + chromium
        run: |
          pip install --quiet faster-whisper playwright
          python3 -m playwright install --with-deps chromium

      - name: Download narration from Higgsfield CDN
        working-directory: scripts/pilot2
        run: |
          curl -sf -o qoq_narration.wav "$NARRATION_URL"
          ls -la
        env:
          NARRATION_URL: https://d8j0ntlcm91z4.cloudfront.net/user_3DHZDwYAr0mvwHad9r4Zby8yRNL/hf_20260705_020341_9a50f3a3-7509-4ad8-8363-5752f5043acf.wav

      - name: Render motion graphics video
        run: python3 scripts/pilot2/render.py scripts/pilot2/qoq2026.json

      - name: Commit result to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p assets/pilot
          cp scripts/pilot2/quarter-over-quarter-pilot.mp4 assets/pilot/
          git add -f assets/pilot/quarter-over-quarter-pilot.mp4
          git commit -m "Add CI-rendered pilot (Quarter over Quarter)"
          git push
