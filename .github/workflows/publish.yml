name: publish

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no real posts)"
        required: false
        default: "true"
  schedule:
    # Daily at 09:00 UTC. Adjust to match your audience time zone.
    - cron: "0 9 * * *"

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      POSTIZ_BASE_URL: ${{ secrets.POSTIZ_BASE_URL }}
      POSTIZ_API_KEY: ${{ secrets.POSTIZ_API_KEY }}
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci || npm install

      - run: npm run schedule

      - name: Commit archived posts
        if: ${{ env.DRY_RUN != 'true' }}
        run: |
          if [ -n "$(git status --porcelain content/ready content/archive)" ]; then
            git config user.name "reel-publisher"
            git config user.email "publisher@users.noreply.github.com"
            git add content/ready content/archive
            git commit -m "Publish: archived $(date -u +%Y-%m-%d)"
            git push
          fi
